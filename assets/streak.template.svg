<svg xmlns="http://www.w3.org/2000/svg" width="490" height="195" viewBox="0 0 490 195" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&#39;Liberation Mono&#39;,monospace" role="img" aria-label="Sayantan Pachal — streak.sh">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.5" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <clipPath id="winClip">
      <rect x="2" y="2" width="486" height="191" rx="14" />
    </clipPath>
  </defs>

  <style>
    /* Light Theme (Default) */
    .bg-panel { fill: #F8FAFC; }
    .bg-bar { fill: #F1F5F9; }
    .divider { stroke: rgba(15, 23, 42, 0.10); }
    .bar-title { fill: #475569; font-size: 11px; }
    .sec-title { fill: #0891B2; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .hud-box { fill: #EEF2F6; stroke: rgba(8, 145, 178, 0.25); }
    .metric-val { fill: #0F172A; font-size: 22px; font-weight: 700; }
    .streak-val { fill: #0891B2; font-size: 22px; font-weight: 700; }
    .metric-lbl { fill: #0891B2; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    .metric-date { fill: #64748B; font-size: 9.5px; }
    .ring-bg { stroke: rgba(16, 185, 129, 0.18); }
    .live { fill: #10B981; font-size: 10px; font-weight: 700; }

    /* Dark Theme (Auto-detected) */
    @media (prefers-color-scheme: dark) {
      .bg-panel { fill: #0B1120; }
      .bg-bar { fill: #111827; }
      .divider { stroke: rgba(148, 163, 184, 0.14); }
      .bar-title { fill: #94A3B8; }
      .sec-title { fill: #22D3EE; }
      .hud-box { fill: #070B14; stroke: rgba(34, 211, 238, 0.30); }
      .metric-val { fill: #F8FAFC; }
      .streak-val { fill: #34D399; }
      .metric-lbl { fill: #22D3EE; }
      .metric-date { fill: #94A3B8; }
      .ring-bg { stroke: rgba(52, 211, 153, 0.20); }
      .live { fill: #34D399; }
    }
  </style>

  <g clip-path="url(#winClip)">
    <rect x="2" y="2" width="486" height="191" class="bg-panel" />
    <rect x="2" y="2" width="486" height="34" class="bg-bar" />
    <line x1="2" y1="36" x2="488" y2="36" class="divider" />

    <!-- Window Controls -->
    <circle cx="22" cy="19" r="4.5" fill="#ff5f56" />
    <circle cx="38" cy="19" r="4.5" fill="#ffbd2e" />
    <circle cx="54" cy="19" r="4.5" fill="#27c93f" />
    <text x="245" y="23" text-anchor="middle" class="bar-title">sayantan@orion - % ./streak.sh --status</text>

    <!-- Section Header -->
    <text x="24" y="56" class="sec-title">STREAK.TELEMETRY</text>
    <line x1="162" y1="52" x2="405" y2="52" class="divider" />
    <text x="466" y="56" text-anchor="end" class="live">● ACTIVE<animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" /></text>

    <!-- Col 1: Total Contributions -->
    <rect x="24" y="68" width="136" height="106" rx="8" class="hud-box" />
    <text x="92" y="92" text-anchor="middle" class="metric-lbl">TOTAL.CONTRIB</text>
    <text x="92" y="126" text-anchor="middle" class="metric-val">{{TOTAL_CONTRIB}}</text>
    <text x="92" y="154" text-anchor="middle" class="metric-date">{{CONTRIB_RANGE}}</text>

    <!-- Col 2: Current Streak (Center HUD with Ring) -->
    <rect x="172" y="68" width="146" height="106" rx="8" class="hud-box" />
    <path d="M 180 68 L 172 68 L 172 76" fill="none" stroke="#10B981" stroke-width="1.8" />
    <path d="M 310 68 L 318 68 L 318 76" fill="none" stroke="#10B981" stroke-width="1.8" />
    <path d="M 180 174 L 172 174 L 172 166" fill="none" stroke="#10B981" stroke-width="1.8" />
    <path d="M 310 174 L 318 174 L 318 166" fill="none" stroke="#10B981" stroke-width="1.8" />

    <g transform="translate(245, 112)">
      <circle cx="0" cy="0" r="29" fill="none" stroke-width="3.5" class="ring-bg" />
      <circle cx="0" cy="0" r="29" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-dasharray="145 185" stroke-linecap="round" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" from="145" to="0" dur="1.4s" fill="freeze" />
      </circle>
      <text x="0" y="8" text-anchor="middle" class="streak-val">{{CURRENT_STREAK}}</text>
    </g>
    <text x="245" y="162" text-anchor="middle" class="metric-lbl">CURRENT.STREAK</text>

    <!-- Col 3: Longest Streak -->
    <rect x="330" y="68" width="136" height="106" rx="8" class="hud-box" />
    <text x="398" y="92" text-anchor="middle" class="metric-lbl">LONGEST.STREAK</text>
    <text x="398" y="126" text-anchor="middle" class="metric-val">{{LONGEST_STREAK}}</text>
    <text x="398" y="154" text-anchor="middle" class="metric-date">{{LONGEST_RANGE}}</text>
  </g>

  <!-- Outer Glowing Border -->
  <rect x="2.5" y="2.5" width="485" height="190" rx="13.5" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.5" filter="url(#glow)" />
  <rect x="2.5" y="2.5" width="485" height="190" rx="13.5" fill="none" stroke="url(#accent)" stroke-width="1.5" />
</svg>