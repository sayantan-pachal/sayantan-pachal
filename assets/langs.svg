<svg xmlns="http://www.w3.org/2000/svg" width="540" height="190" viewBox="0 0 540 190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&#39;Liberation Mono&#39;,monospace" role="img" aria-label="Sayantan Pachal — langs.sh">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.5" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <clipPath id="winClip">
      <rect x="2" y="2" width="536" height="186" rx="14" />
    </clipPath>
    <clipPath id="barClip">
      <rect x="24" y="68" width="492" height="12" rx="6" />
    </clipPath>
  </defs>

  <style>
    /* Light Theme (Default) */
    .bg-panel { fill: #F8FAFC; }
    .bg-bar { fill: #F1F5F9; }
    .divider { stroke: rgba(15, 23, 42, 0.10); }
    .bar-title { fill: #475569; font-size: 11px; }
    .sec-title { fill: #0891B2; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .key { fill: #0F172A; font-size: 12.5px; font-weight: 700; }
    .dots { fill: rgba(15, 23, 42, 0.25); font-size: 12.5px; }
    .val { fill: #0891B2; font-size: 12.5px; font-weight: 700; }
    .track { fill: #E2E8F0; }
    .live { fill: #0891B2; font-size: 10px; font-weight: 700; }

    /* Dark Theme (Auto-detected) */
    @media (prefers-color-scheme: dark) {
      .bg-panel { fill: #0B1120; }
      .bg-bar { fill: #111827; }
      .divider { stroke: rgba(148, 163, 184, 0.14); }
      .bar-title { fill: #94A3B8; }
      .sec-title { fill: #22D3EE; }
      .key { fill: #F1F5F9; }
      .dots { fill: rgba(148, 163, 184, 0.25); }
      .val { fill: #22D3EE; }
      .track { fill: #1E293B; }
      .live { fill: #22D3EE; }
    }
  </style>

  <g clip-path="url(#winClip)">
    <rect x="2" y="2" width="536" height="186" class="bg-panel" />
    <rect x="2" y="2" width="536" height="34" class="bg-bar" />
    <line x1="2" y1="36" x2="538" y2="36" class="divider" />

    <!-- Window Controls -->
    <circle cx="22" cy="19" r="4.5" fill="#ff5f56" />
    <circle cx="38" cy="19" r="4.5" fill="#ffbd2e" />
    <circle cx="54" cy="19" r="4.5" fill="#27c93f" />
    <text x="270" y="23" text-anchor="middle" class="bar-title">sayantan@orion - % ./langs.sh --analyze</text>

    <!-- Section Header -->
    <text x="24" y="56" class="sec-title">LANG.DISTRIBUTION</text>
    <line x1="172" y1="52" x2="455" y2="52" class="divider" />
    <text x="516" y="56" text-anchor="end" class="live">● SYNCED</text>

    <!-- Multi-Language Progress Bar -->
    <rect x="24" y="68" width="492" height="12" rx="6" class="track" />
    <g clip-path="url(#barClip)">
      <rect x="24" y="68" width="428.1" height="12" fill="#f1e05a" />
      <rect x="452.1" y="68" width="26.8" height="12" fill="#e34c26" />
      <rect x="478.8" y="68" width="22.3" height="12" fill="#663399" />
      <rect x="501.2" y="68" width="8.0" height="12" fill="#3572A5" />
      <rect x="509.2" y="68" width="3.7" height="12" fill="#f34b7d" />
    </g>

    <!-- Column 1 -->
    <g transform="translate(24, 106)">
      <circle cx="6" cy="-4" r="5" fill="#f1e05a" />
      <text x="18" y="0"><tspan class="key">JavaScript </tspan><tspan class="dots">........... </tspan><tspan class="val">87.0%</tspan></text>

      <circle cx="6" cy="22" r="5" fill="#e34c26" />
      <text x="18" y="26"><tspan class="key">HTML       </tspan><tspan class="dots">..... </tspan><tspan class="val">5.4%</tspan></text>

      <circle cx="6" cy="48" r="5" fill="#663399" />
      <text x="18" y="52"><tspan class="key">CSS        </tspan><tspan class="dots">.......... </tspan><tspan class="val">4.5%</tspan></text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(284, 106)">
      <circle cx="6" cy="-4" r="5" fill="#3572A5" />
      <text x="18" y="0"><tspan class="key">Python     </tspan><tspan class="dots">..... </tspan><tspan class="val">1.6%</tspan></text>

      <circle cx="6" cy="22" r="5" fill="#f34b7d" />
      <text x="18" y="26"><tspan class="key">C++        </tspan><tspan class="dots">........ </tspan><tspan class="val">0.8%</tspan></text>
    </g>
  </g>

  <!-- Outer Glowing Border -->
  <rect x="2.5" y="2.5" width="535" height="185" rx="13.5" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.5" filter="url(#glow)" />
  <rect x="2.5" y="2.5" width="535" height="185" rx="13.5" fill="none" stroke="url(#accent)" stroke-width="1.5" />
</svg>