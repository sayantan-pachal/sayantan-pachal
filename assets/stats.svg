<svg xmlns="http://www.w3.org/2000/svg" width="490" height="195" viewBox="0 0 490 195" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&#39;Liberation Mono&#39;,monospace" role="img" aria-label="Sayantan Pachal — stats.sh">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.5" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <clipPath id="winClip">
      <rect x="2" y="2" width="486" height="191" rx="14" />
    </clipPath>
  </defs>

  <style>
    /* Light Theme (Default) */
    .bg-panel { fill: #F8FAFC; }
    .bg-bar { fill: #F1F5F9; }
    .divider { stroke: rgba(15, 23, 42, 0.10); }
    .bar-title { fill: #475569; font-size: 11px; }
    .sec-title { fill: #0891B2; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .key { fill: #0891B2; font-size: 12.5px; }
    .dots { fill: rgba(15, 23, 42, 0.25); font-size: 12.5px; }
    .val { fill: #0F172A; font-size: 12.5px; font-weight: 700; }
    .hud-box { fill: #EEF2F6; stroke: rgba(8, 145, 178, 0.30); }
    .ring-bg { stroke: rgba(8, 145, 178, 0.15); }
    .grade-txt { fill: #0F172A; font-size: 20px; font-weight: 700; }
    .grade-sub { fill: #64748B; font-size: 9px; letter-spacing: 1.5px; }
    .live { fill: #DC2626; font-size: 10px; font-weight: 700; }

    /* Dark Theme (Auto-detected) */
    @media (prefers-color-scheme: dark) {
      .bg-panel { fill: #0B1120; }
      .bg-bar { fill: #111827; }
      .divider { stroke: rgba(148, 163, 184, 0.14); }
      .bar-title { fill: #94A3B8; }
      .sec-title { fill: #22D3EE; }
      .key { fill: #22D3EE; }
      .dots { fill: rgba(148, 163, 184, 0.25); }
      .val { fill: #F1F5F9; }
      .hud-box { fill: #070B14; stroke: rgba(34, 211, 238, 0.35); }
      .ring-bg { stroke: rgba(34, 211, 238, 0.18); }
      .grade-txt { fill: #F8FAFC; }
      .grade-sub { fill: #94A3B8; }
      .live { fill: #F87171; }
    }
  </style>

  <g clip-path="url(#winClip)">
    <rect x="2" y="2" width="486" height="191" class="bg-panel" />
    <rect x="2" y="2" width="486" height="34" class="bg-bar" />
    <line x1="2" y1="36" x2="488" y2="36" class="divider" />

    <!-- Window Controls -->
    <circle cx="22" cy="19" r="4.5" fill="#ff5f56" />
    <circle cx="38" cy="19" r="4.5" fill="#ffbd2e" />
    <circle cx="54" cy="19" r="4.5" fill="#27c93f" />
    <text x="245" y="23" text-anchor="middle" class="bar-title">sayantan@orion - % ./stats.sh --metrics</text>

    <!-- Section Header -->
    <text x="24" y="56" class="sec-title">GITHUB.METRICS</text>
    <line x1="145" y1="52" x2="415" y2="52" class="divider" />
    <text x="466" y="56" text-anchor="end" class="live">● LIVE<animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite" /></text>

    <!-- Metric Rows (Variables Injected by Action) -->
    <g transform="translate(24, 80)">
      <text y="0"><tspan class="key">Stars.Earned </tspan><tspan class="dots">................. </tspan><tspan class="val">0</tspan></text>
      <text y="22"><tspan class="key">Total.Commits </tspan><tspan class="dots">................ </tspan><tspan class="val">214</tspan></text>
      <text y="44"><tspan class="key">Pull.Requests </tspan><tspan class="dots">................ </tspan><tspan class="val">43</tspan></text>
      <text y="66"><tspan class="key">Issues.Solved </tspan><tspan class="dots">................ </tspan><tspan class="val">1</tspan></text>
      <text y="88"><tspan class="key">Public.Repos </tspan><tspan class="dots">................. </tspan><tspan class="val">19</tspan></text>
    </g>

    <!-- Right HUD Grade Badge -->
    <rect x="332" y="68" width="134" height="106" rx="8" class="hud-box" />
    <path d="M 340 68 L 332 68 L 332 76" fill="none" stroke="#06B6D4" stroke-width="1.8" />
    <path d="M 458 68 L 466 68 L 466 76" fill="none" stroke="#06B6D4" stroke-width="1.8" />
    <path d="M 340 174 L 332 174 L 332 166" fill="none" stroke="#06B6D4" stroke-width="1.8" />
    <path d="M 458 174 L 466 174 L 466 166" fill="none" stroke="#06B6D4" stroke-width="1.8" />

    <!-- Animated Grade Ring -->
    <g transform="translate(399, 114)">
      <circle cx="0" cy="0" r="30" fill="none" stroke-width="4" class="ring-bg" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="160 190" stroke-linecap="round" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" from="160" to="0" dur="1.4s" fill="freeze" />
      </circle>
      <text x="0" y="7" text-anchor="middle" class="grade-txt">A+</text>
    </g>
    <text x="399" y="164" text-anchor="middle" class="grade-sub">RANK // TOP 5%</text>
  </g>

  <!-- Outer Glowing Border -->
  <rect x="2.5" y="2.5" width="485" height="190" rx="13.5" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.5" filter="url(#glow)" />
  <rect x="2.5" y="2.5" width="485" height="190" rx="13.5" fill="none" stroke="url(#accent)" stroke-width="1.5" />
</svg>