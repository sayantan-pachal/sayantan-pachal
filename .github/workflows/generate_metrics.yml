name: Generate GitHub Metrics

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - 'projects.json'
      - 'build_projects.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Builder Scripts
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python build_metrics.py
          python build_projects.py

      - name: Commit and Push SVGs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/stats.svg assets/streak.svg assets/langs.svg assets/projects.svg
          git commit -m "chore: auto-update dynamic github metrics and projects" || exit 0
          git push